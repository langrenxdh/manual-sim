name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core and Training tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/Sim.Core.Tests
      - run: dotnet test --project tests/Sim.Training.Tests
